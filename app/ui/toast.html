<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>fixen</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; cursor: pointer; user-select: none;
    font: 13px/1.45 -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: transparent;
  }
  .card {
    height: 100%; padding: 12px 14px; border-radius: 14px;
    background: #fbf8f1; color: #191714;
    border: 1px solid #e0d8c8; box-shadow: 0 10px 30px rgba(25,23,20,.18);
    display: flex; flex-direction: column; gap: 4px; justify-content: center;
    animation: in .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .tag { font: 700 9px/1 ui-monospace, monospace; letter-spacing: .08em; color: #e0603f; flex: none; width: 26px; }
  .was { color: #8a8072; text-decoration: line-through; text-decoration-color: rgba(192,57,43,.6); }
  .now { font-weight: 700; }
  .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { color: #6b6255; font-size: 11.5px; padding-left: 34px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand { position: absolute; top: 10px; right: 12px; color: #e0603f; opacity: .8; }
  @media (prefers-color-scheme: dark) {
    .card { background: #1d1a16; color: #f4f1ea; border-color: #33302a; }
    .was { color: #8a8072; }
    .note { color: #a89e8e; }
  }
</style>
<body>
  <div class="card" id="card">
    <svg class="brand" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 14.5h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M13.6 14.5 16 11.4l2.4 3.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="row"><span class="tag">WAS</span><span class="txt was" id="was"></span></div>
    <div class="row"><span class="tag">NOW</span><span class="txt now" id="now"></span></div>
    <div class="note" id="note" hidden></div>
  </div>
  <script>
    (function () {
      let rec = {};
      try { rec = JSON.parse(new URLSearchParams(location.search).get("d") || "{}"); } catch {}
      document.getElementById("was").textContent = rec.original || "";
      document.getElementById("now").textContent = rec.corrected || "";
      const note = (rec.notes || [])[0];
      if (note) {
        const el = document.getElementById("note");
        el.textContent = note;
        el.hidden = false;
      }
      document.getElementById("card").addEventListener("click", () => {
        const tauri = window.__TAURI__;
        if (tauri && tauri.core) tauri.core.invoke("open_panel");
      });
    })();
  </script>
</body>
</html>
