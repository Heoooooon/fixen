<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixen app icon — 1024</title>
<style>
/* ==========================================================================
   fixen — macOS Big Sur+ app icon, 1024x1024
   Screenshot this page at exactly 1024x1024, then run `tauri icon`.

   Design system: every value is a token from bin/gui.html :root or a ratio of
   the 1024 icon grid. The SVG defs restate those tokens as literal hex (each
   annotated) because `var()` inside <stop stop-color> is not resolved by all
   rasterisers; the CSS custom properties stay the source of truth for the tile.

   Mark construction: horizontal rules are <rect>s (a stroked zero-height path
   is dropped by some rasterisers under a filter), the caret is a stroked
   polyline with round caps/joins — that is what makes it read as a
   proofreader's insertion mark rather than a solid wedge.
   ========================================================================== */
:root {
  /* --- palette: paper & ink -------------------------------------------- */
  --paper:        #fbf8f1;
  --paper-lift:   #fffdf8;   /* paper, top-lit                             */
  --paper-sunk:   #efe6d4;   /* paper, bottom-shaded (~ --surface-sunk)    */
  --ink:          #191714;

  /* --- palette: semantic ------------------------------------------------ */
  --accent:       #e0603f;
  --accent-deep:  #bf3828;

  /* --- icon grid --------------------------------------------------------- */
  --canvas:       1024px;
  --radius-tile:  232px;     /* Big Sur squircle approximation @1024        */

  /* --- elevation (icon scale) -------------------------------------------- */
  --edge-hair:    rgba(25, 23, 20, .13);    /* --ink @13%                   */
  --inner-light:  rgba(255, 255, 255, .96);
  --inner-shade:  rgba(25, 23, 20, .085);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: var(--canvas);
  height: var(--canvas);
  background: transparent;   /* keep the squircle corners knocked out */
}

body { display: grid; place-items: center; }

/* --------------------------------------------------------------------------
   Tile — full-bleed rounded square, layered for depth:
     1. warm paper gradient, lit from the upper-left
     2. accent wash + ink pool (the design system's paper "tooth")
     3. inner light bevel on top, inner shade along the bottom
     4. hairline outer edge so the tile separates on any desktop
   -------------------------------------------------------------------------- */
.tile {
  position: relative;
  width: var(--canvas);
  height: var(--canvas);
  border-radius: var(--radius-tile);
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(120% 100% at 26% 2%,
      var(--paper-lift) 0%,
      var(--paper)      44%,
      var(--paper-sunk) 100%);
  box-shadow:
    inset 0  4px 0 0 var(--inner-light),
    inset 0 -4px 0 0 var(--inner-shade),
    inset 0  0   0 3px var(--edge-hair);
}

.tile::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(72% 58% at 16% -8%, rgba(224, 96, 63, .12) 0%, transparent 64%),
    radial-gradient(88% 72% at 86% 114%, rgba(25, 23, 20, .07) 0%, transparent 62%);
}

.mark { position: relative; display: block; width: var(--canvas); height: var(--canvas); }
</style>
</head>
<body>
  <div class="tile">
    <svg class="mark" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- --accent lit from above, settling into --accent-deep at the base -->
        <linearGradient id="coral" x1="0" y1="286" x2="0" y2="628" gradientUnits="userSpaceOnUse">
          <stop offset="0"   stop-color="#f4855f"/><!-- --accent + light -->
          <stop offset=".54" stop-color="#e0603f"/><!-- --accent          -->
          <stop offset="1"   stop-color="#bf3828"/><!-- --accent-deep     -->
        </linearGradient>

        <!-- --ink rules: the line of text being proofread -->
        <linearGradient id="inkline" x1="0" y1="300" x2="0" y2="700" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#2f2a23"/><!-- --ink-2 -->
          <stop offset="1" stop-color="#191714"/><!-- --ink   -->
        </linearGradient>

        <!-- contact shadows onto the paper -->
        <filter id="cast" x="-25%" y="-25%" width="150%" height="170%">
          <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#a8301f" flood-opacity=".34"/>
        </filter>
        <filter id="castInk" x="-25%" y="-30%" width="150%" height="180%">
          <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#191714" flood-opacity=".17"/>
        </filter>

        <!-- The caret cuts a clean channel through the ink rules, so the
             correction visibly sits *in front of* the text it is fixing. -->
        <mask id="cutCaret" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
          <rect width="1024" height="1024" fill="#fff"/>
          <polyline points="360,556 512,306 664,556" fill="none" stroke="#000"
                    stroke-width="150" stroke-linecap="round" stroke-linejoin="round"/>
        </mask>
      </defs>

      <!-- ---- the line of text being proofread (ink), notched by the caret -->
      <g filter="url(#castInk)" mask="url(#cutCaret)" fill="url(#inkline)">
        <rect x="186" y="330" width="652" height="54" rx="27" opacity=".92"/>
        <rect x="186" y="654" width="454" height="54" rx="27" opacity=".46"/>
      </g>

      <!-- ---- the correction: heavy coral rule + caret striking up through -->
      <g filter="url(#cast)">
        <!-- the proofreader's underline -->
        <rect x="186" y="494" width="652" height="70" rx="35" fill="url(#coral)"/>
        <!-- the insertion caret rising through that line -->
        <polyline points="360,556 512,306 664,556" fill="none" stroke="url(#coral)"
                  stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
  </div>
</body>
</html>
